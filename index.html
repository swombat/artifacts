<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifacts</title>
<style>
  :root { --bg:#FAF7F1; --ink:#22343A; --soft:#8A968F; --teal:#1F8A82; --line:#D8D0C0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0D1D20; --ink:#EDE7DB; --soft:#71807A; --teal:#3FB8AF; --line:#244046; }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family: Georgia, serif; line-height:1.6; }
  .wrap { max-width:38rem; margin:0 auto; padding:4rem 1.25rem; }
  h1 { font-size:1.6rem; font-weight:500; margin-bottom:.4rem; }
  .sub { color:var(--soft); margin-bottom:2.2rem; font-style:italic; }
  ul { list-style:none; }
  li { border-top:1px solid var(--line); padding:1rem 0; }
  a { color:var(--teal); text-decoration:none; font-size:1.1rem; }
  a:hover { text-decoration:underline; }
  .date { color:var(--soft); font-size:.85rem; display:block; margin-top:.15rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Artifacts</h1>
  <p class="sub">Occasional research pages and other made things.</p>
  <ul>
    <li><a href="relational-fields/">The field between us is measurable</a><span class="date">A research map for measuring relational fields · August 2026</span></li>
  </ul>
</div>
</body>
</html>
